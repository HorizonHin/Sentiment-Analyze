platforms:
  enabled: true                         # 是否启用热榜平台抓取
  sources:
    - id: "weibo"
      name: "微博"   
    - id: "baidu"
      name: "百度热搜"
    - id: "bilibili-hot-search"
      name: "bilibili 热搜"
    - id: "douyin"
      name: "抖音"
    - id: "toutiao"
      name: "今日头条"
    - id: "zhihu"
      name: "知乎"
    - id: "tieba"
      name: "贴吧"
    - id: "thepaper"
      name: "澎湃新闻"
    - id: "hupu"
      name: "虎扑"
    - id: "tencent-hot"
      name: "腾讯新闻"

    ####下面的平台由于评论过低，暂时停用
    # - id: "cls-hot"
    #   name: "财联社热门"
    # - id: "ifeng"
    #   name: "凤凰网"
    # - id: "wallstreetcn-hot"
    #   name: "华尔街见闻"




weight:
  rank_threshold: 10
  weight_config:
    RANK_WEIGHT: 0.6
    FREQUENCY_WEIGHT: 0.3
    HOTNESS_WEIGHT: 0.1

llm_executor:
  max_workers: 8

scheduler:  
  crawl_interval_minutes: 23       # 系统周期（原 CRAWL_INTERVAL_MINUTES）

sentiment:
  first_time_lookback_days: 14      # 查询分区键 first_time 默认回溯天数
  weibo:
    max_comments: 10               # 评论爬取数量限制

common_thread_pool:
  max_workers: 4

llm:
  api_key: ""                      # 请填写通义千问 API Key ，不填则默认使用环境变量中的 API Key

topic:
  lookback_hours: 4                 # 热点回看窗口（小时）。不配置时默认按 12.2 个抓取周期
  default_top_n: 60                 # 推荐话题数量默认值
  default_cache_limit: 60           # 话题缓存上限默认值
  default_history_limit: 100        # 话题历史记录条数默认值
  default_days_lookback: 7          # 话题回溯天数默认值（如不填则自动由first_time_lookback_seconds推算）
  heat_stage:
    decline_threshold_percent: -15.0
    climax_peak_ratio: 0.9
    climax_change_abs_limit_percent: 20.0
    growth_threshold_percent: 20.0

risk_warning:
  negative_ratio_threshold: 0.5                # 负面舆情占比阈值 (0-1)
  negative_news_count_threshold: 3            # 负面新闻起征点 (篇)
  burst_heat_change_threshold: 60.0            # 热度爆发增长率阈值 (%)
  cross_platform_gap_threshold: 0.35           # 跨平台情感分差值阈值 (0-2)

mssql:
  server: "localhost"              # 优先级：配置文件 > 默认值(localhost)
  database: "sentiment_analyze"    # 优先级：配置文件 > 默认值(sentiment_analyze)
  username: "月迷津渡"                   # 优先级：配置文件 > 默认值(sa)
  password: ""                     # 优先级：配置文件 > 默认值("")
  driver: "ODBC Driver 17 for SQL Server"